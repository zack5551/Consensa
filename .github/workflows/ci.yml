name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm perf:budget

  e2e:
    name: Playwright + axe (EN/FR, phone + desktop)
    runs-on: ubuntu-24.04  # Playwright 1.56 cannot install Chromium on ubuntu-latest (26.04)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The GitHub runner image already has Chromium's system libraries. Installing extras (fonts) through apt
      # failed twice on 2026-11-11 when Ubuntu's mirror couldn't be resolved, so a failed apt step falls back to
      # the browser alone instead of failing the check before any test runs. The site's fonts are local files.
      - name: Install Chromium
        # Cap the apt attempt: on 2026-11-11 its retries took 10 of the job's 20 minutes before falling back.
        run: timeout 180 pnpm exec playwright install --with-deps chromium || pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
